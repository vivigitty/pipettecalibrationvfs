services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: vfl
      POSTGRES_USER: vfl_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vfl_owner -d vfl']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data: